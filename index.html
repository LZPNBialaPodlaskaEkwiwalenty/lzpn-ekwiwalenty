<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator sędziowski — nowy adres</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="canonical" href="https://kalkulatorsedziego.netlify.app/">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:'Segoe UI', Arial, sans-serif;
            background:linear-gradient(135deg,#050505,#101010);
            color:#ececec;
            text-align:center;
            padding:20px;
        }
        .box{
            max-width:420px;
        }
        h1{
            font-size:1.4rem;
            margin-bottom:14px;
            color:#f0cf66;
        }
        p{
            font-size:.95rem;
            color:#b7b7b7;
            margin-bottom:22px;
            line-height:1.5;
        }
        a.btn{
            display:inline-block;
            padding:14px 28px;
            border-radius:12px;
            background:linear-gradient(135deg,#d4af37,#f0cf66);
            color:#111;
            font-weight:700;
            text-decoration:none;
        }
        .spinner{
            width:34px;
            height:34px;
            margin:0 auto 22px auto;
            border-radius:50%;
            border:3px solid rgba(212,175,55,.2);
            border-top-color:#d4af37;
            animation:spin .8s linear infinite;
        }
        @keyframes spin{ to{ transform:rotate(360deg); } }
    </style>
    <script>
        (async function(){

            const target = "https://kalkulatorsedziego.netlify.app/";

            try{
                if("serviceWorker" in navigator){
                    const regs = await navigator.serviceWorker.getRegistrations();
                    for(const reg of regs){
                        await reg.unregister();
                    }
                }
            }catch(e){}

            try{
                if("caches" in window){
                    const keys = await caches.keys();
                    await Promise.all(keys.map(k => caches.delete(k)));
                }
            }catch(e){}

            window.location.replace(target);
        })();
    </script>
</head>
<body>

    <div class="box">
        <div class="spinner"></div>
        <h1>Kalkulator sędziowski zmienił adres</h1>
        <p>
            Przenosimy Cię na nową stronę:<br>
            <strong>kalkulatorsedziego.netlify.app</strong>
        </p>
        <a class="btn" href="https://kalkulatorsedziego.netlify.app/">Przejdź teraz →</a>
    </div>

</body>
</html>
